# Filters for ndc. All keys are optional; whatever is not set is not filtered.
# The contents are passed unchanged as query parameters to the NetBox REST API.
# Syntax: https://netboxlabs.com/docs/netbox/reference/filtering/
# Lists are sent as a repeated parameter (several values = OR, with __n = none of them).

# Filter for /api/dcim/device-types/ (the types loaded into the cache).
device_types:
  manufacturer: cisco

# Filter for /api/dcim/devices/ (ndc adds the site slug).
devices:
  manufacturer: cisco

# Filter for /api/dcim/interfaces/ and /api/dcim/interface-templates/,
# i.e. for device and device type alike.
# Note: NetBox validates the values; unknown types result in a 400 error.
interface_filter:
  mgmt_only: false
  type__n:
    - virtual
    - lag
    - cisco-stackwise
    - cisco-stackwise-plus
    - cisco-stackwise-80
    - cisco-stackwise-160
    - cisco-stackwise-320
    - cisco-stackwise-480
    - cisco-stackwise-1t
    - cisco-flexstack
    - cisco-flexstack-plus
